name: Flusso AUTOMATICO Spese-Entrate

on:
  workflow_dispatch:
    inputs:
      invia_mail:
        description: "Invia mail di riepilogo/errore al termine del flusso"
        required: false
        default: true
        type: boolean

jobs:
  flusso:
    runs-on: ubuntu-latest

    env:
      FLAG_AUTOMATIC: true
      FLAG_SCRITTURA_SUL_DRIVE: true
      FLAG_SOVRASCRIVI_SHEET:   true
      FLAG_SOVRASCRIVI_RAW_DBX: true
      FLAG_LOG_DUPLICATI:       true
      FLAG_LOG_ALTRO:           true
      FLAG_INVIA_MAIL:          ${{ inputs.invia_mail }}
      DROPBOX_APP_KEY:          ${{ secrets.DROPBOX_APP_KEY }}
      DROPBOX_APP_SECRET:       ${{ secrets.DROPBOX_APP_SECRET }}
      DROPBOX_REFRESH_TOKEN:    ${{ secrets.DROPBOX_REFRESH_TOKEN }}
      GOOGLE_SERVICE_ACCOUNT:   ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Esegui flusso
        run: python main_job_auto.py
